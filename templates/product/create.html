{% extends 'layout/base.html' %} 

{% block title %}Add Product{% endblock %} 

{% block page_title %}Product Management{% endblock %} 

{% block content %}
<!-- Page Header -->
<div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
  <div>
    <h2 class="fw-bold mb-1">Add Product</h2>
    <p class="text-muted mb-0">Create a new product in your catalog</p>
  </div>

  <a href="{{ url_for('index_product') }}" class="btn btn-outline-secondary">
    <i class="bi bi-arrow-left me-1"></i>
    Back to Products
  </a>
</div>

<!-- Form Card -->
<div class="card border-0 shadow-sm">
  <div class="card-body p-4 p-md-5">
    <form action="{{ url_for('create_product') }}" method="POST" enctype="multipart/form-data">
      
      <!-- Product Name -->
      <div class="mb-3">
        <label for="name" class="form-label fw-semibold">Product Name <span class="text-danger">*</span></label>
        <input 
          type="text" 
          class="form-control" 
          id="name" 
          name="name" 
          placeholder="Enter product name..." 
          maxlength="50"
          required
        >
        <div class="form-text">Maximum 50 characters.</div>
      </div>

      <!-- Category and Price Row -->
      <div class="row">
        <!-- Category -->
        <div class="col-md-6 mb-3">
          <label for="category_id" class="form-label fw-semibold">Category</label>
          <select class="form-select" id="category_id" name="category_id">
            <option value="" selected disabled>Select category</option>
            {% for cat in categories %}
              <option value="{{ cat.id }}">{{ cat.name }}</option>
            {% endfor %}
          </select>
        </div>

        <!-- Price -->
        <div class="col-md-6 mb-3">
          <label for="price" class="form-label fw-semibold">Price ($)</label>
          <div class="input-group">
            <span class="input-group-text">$</span>
            <input 
              type="number" 
              step="0.01" 
              min="0" 
              class="form-control" 
              id="price" 
              name="price" 
              placeholder="0.00" 
              value="0.00"
            >
          </div>
        </div>
      </div>

      <!-- Stock and Image Row -->
      <div class="row">
        <!-- Stock -->
        <div class="col-md-6 mb-3">
          <label for="stock" class="form-label fw-semibold">Stock Quantity</label>
          <input 
            type="number" 
            min="0" 
            class="form-control" 
            id="stock" 
            name="stock" 
            placeholder="0" 
            value="0"
          >
        </div>

        <!-- Image/File Upload -->
        <div class="col-md-6 mb-3">
          <label for="image" class="form-label fw-semibold">Product Image</label>
          <input 
            type="file" 
            class="form-control" 
            id="image" 
            name="image" 
          >
        </div>
      </div>

      <!-- Description -->
      <div class="mb-4">
        <label for="description" class="form-label fw-semibold">Description</label>
        <textarea 
          class="form-control" 
          id="description" 
          name="description" 
          rows="4" 
          placeholder="Provide a detailed description of the product..."
        ></textarea>
      </div>

      <!-- Form Actions -->
      <div class="d-flex justify-content-end gap-2">
        <a href="{{ url_for('index_product') }}" class="btn btn-light px-4">Cancel</a>
        <button type="submit" class="btn btn-primary px-4">
          <i class="bi bi-check-lg me-1"></i> Save Product
        </button>
      </div>

    </form>
  </div>
</div>
{% endblock %}
